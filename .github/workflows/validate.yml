name: validate-repo

# 双端工作制：任一端 push / PR 都做一次跨端合规体检
# 规则见 tools/validate-repo.mjs（Windows/macOS 绝对路径、密钥、垃圾文件、体积、skill frontmatter）
#   + vault 路径活性（比对 tools/vault-paths.json 基线，抓"vault 重组后 skill 路径失效"）
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 跨端仓库体检
        run: node tools/validate-repo.mjs
      # 外部源门禁（workflow_migration / timer-agent / ~/.dsh）需要本机 vault，
      # ubuntu runner 拿不到，故不在 CI 跑——见 tools/README-vault-gates.md。
      # 本机手动执行（真实 vault 路径不入库，必须显式传入）：
      #   $env:VAULT_PATH = "D:\path\to\your\vault"
      #   node tools/vault-path-check-external.mjs
      #
      #   ⚠️ 改本门禁的提取逻辑后，必须先做灵敏度自测再信任其"通过"：
      #     GATE_PROBE=<探针文件> node tools/vault-path-check-external.mjs
      #   该门禁曾因正则拼装漏括号而只检查一个顶层域却报"通过"，
      #   绿色结果不等于检查生效。
