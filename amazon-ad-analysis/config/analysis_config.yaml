# 输出配置
output:
  directory: './output'
  # Obsidian Vault 输出根目录（Phase 0 需求澄清时确认/覆盖）
  # 默认结构见 SKILL.md 归档章节；本店实测使用: {VAULT_PATH}\工作\亚马逊工作管理\亚马逊分析（2026-08-28 用户确认默认值）
  vault_root: '{VAULT_PATH}/工作/亚马逊工作管理/亚马逊分析'
  attachment_dir: '{VAULT_PATH}/工作/亚马逊工作管理/附件'
  save_checkpoints: true
  report_format:
    - 'markdown'
    - 'excel'
  
  # Markdown报告配置
  markdown:
    include_tables: true
    include_charts: false
    max_rows_in_table: 50
  
  # Excel报告配置
  excel:
    include_summary_sheet: true
    include_data_sheets: true
    max_rows_per_sheet: 10000

# 分析配置
analysis:
  # 周趋势分析
  weekly_trend:
    enabled: true
    weeks: 4  # 分析最近4周
  
  # ASIN深度分析
  asin_deep_dive:
    enabled: true
    max_asins: 10  # 最多分析的ASIN数量
    priority_rules:
      - 'high_sales_high_acos'  # 高销量高ACOS
      - 'low_sales_low_acos'    # 低销量低ACOS
      - 'user_specified'        # 用户指定
  
  # 关键词分析
  keyword_analysis:
    enabled: true
    min_spend: 5.0  # 最低花费阈值
    min_orders: 1   # 最低订单数阈值
    top_n: 50       # 展示前N个词根
  
  # 品牌广告分析
  brand_analysis:
    enabled: true
    include_new_customer_analysis: true

# Listing 抓取档位（Phase 4A 使用，按序降级）
listing_scrape:
  modes: ['jina', 'manual', 'skip']
  jina_url_template: 'https://r.jina.ai/http://amazon.com/dp/{ASIN}'

# 执行环境
environment:
  # Windows 下 pandas 所在解释器（`python` 可能指向无 pandas 的旧版本）
  # 占位：agent 执行时展开（Windows 实测值 = %LOCALAPPDATA%\Programs\Python\Python312\python.exe）
  # macOS 用 python3（pip3 install pandas openpyxl）；跨端对照见 _shared/PORTABILITY.md
  python_windows: '%LOCALAPPDATA%\Programs\Python\Python312\python.exe'
  force_utf8: true   # 控制台输出 UTF-8，避免中文列名乱码/emoji 崩溃

# 数据验证配置
validation:
  required_columns:
    product:
      - 'asin'
      - 'sales'
      - 'revenue'
    ad:
      - 'campaign'
      - 'impressions'
      - 'clicks'
      - 'spend'
    search:
      - 'search_term'
      - 'impressions'
      - 'clicks'
      - 'spend'
  
  min_rows: 10
  max_null_percentage: 0.5
  
  anomaly_detection:
    acos_max: 10.0  # 1000%
    cpc_max: 50.0
    spend_min: 0.01

# 日志配置
logging:
  level: 'INFO'  # DEBUG, INFO, WARNING, ERROR
  file: './output/analysis.log'
  console: true