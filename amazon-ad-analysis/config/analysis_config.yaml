# 阈值配置（唯一阈值来源，SKILL.md / glossary 只引用此处）
thresholds:
  acos:
    good: 0.20          # 优秀：核心盈利
    acceptable: 0.35    # 良好：稳定维持
    needs_optimization: 0.50  # 需关注：优化
    poor: 1.0           # 严重亏损：>100% 优先否定
  # 派生说明：需优化档 = (acceptable, needs_optimization]；使用中统一取以下档位：
  # <20% 优秀 | 20-35% 良好 | 35-50% 需关注 | 50-100% 需优化 | >100% 严重亏损
  
  cvr:
    good: 0.15
    average: 0.10
  
  cpc:
    high: 5.0
  
  spend:
    min_for_analysis: 5.0

