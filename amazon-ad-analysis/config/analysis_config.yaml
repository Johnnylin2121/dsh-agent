# Amazon Ad Analysis 配置文件
# 版本: 1.0
# 更新日期: 2026-08-23

# 阈值配置（唯一阈值来源，SKILL.md / glossary 只引用此处）
thresholds:
  acos:
    good: 0.20          # 优秀：核心盈利
    acceptable: 0.35    # 良好：稳定维持
    needs_optimization: 0.50  # 需关注：优化
    poor: 1.0           # 严重亏损：>100% 优先否定
  # 派生说明：需优化档 = (acceptable, needs_optimization]；使用中统一取以下档位：
  # <20% 优秀 | 20-35% 良好 | 35-50% 需关注 | 50-100% 需优化 | >100% 严重亏损
  
  cvr:
    good: 0.15
    average: 0.10
  
  cpc:
    high: 5.0
  
  roas:
    good: 3.0   # 健康线 >3（优秀>4）；SKILL Phase 2A 与 glossary 引用此档
  
  spend:
    min_for_analysis: 5.0

  # ── 广告集中度（2026-09-17 新增，Phase 2D 使用）────────────────────────
  # ⚠️ [待校准]：来源白皮书《亚马逊流量增长白皮书》L316-324 只给出 92.71% 的极端
  #    案例，未给阈值。以下默认值由本 skill 自定，并用 vault 内 5 个历史 ASIN 的
  #    "Campaign Weekly Trend"（28天花费）实测回算锚定：
  #      top1 = 32.3% / 36.2% / 37.0% / 66.0% / 75.0%；HHI = 0.258 ~ 0.581
  #    按 top1 > 60% 判定 → 实测触发率 2/5（40%），不触发者集中在 32-37%（可区分）
  #    下次拿到真实原始四文件时回算并回填本处数值。
  concentration:
    top1_spend_share_risk: 0.60   # [待校准] 单一广告活动花费 ÷ 该ASIN广告总花费
    hhi_risk: 0.50                # [待校准] Herfindahl 指数（Σ 份额²）
    top3_watch: 0.80              # 头部集中观察线（只提示，不触发风险标）
    min_campaigns_for_check: 3    # 活动数少于此值集中度无统计意义 → 跳过并声明

  # ── 付费-自然结构（2026-09-17 新增，Phase 5.4 使用）────────────────────
  paid_natural:
    core_term_paid_click_share: 0.20  # [待校准] 单搜索词点击 ÷ 该ASIN总广告点击
    natural_order_share_target: 0.50  # 与 Phase 2A 健康线一致（自然订单占比目标）
    # 四象限输入方向（代理改写自白皮书 L695-700；原文用自然位/广告位，我方无该字段）
    quadrant_inputs: ['ad_spend_wow', 'natural_orders_wow']

  # ── 生命周期阶段判定（2026-09-17 新增，Phase 6 D0 使用）────────────────
  # 白皮书 L566 / L568-574：阶段看经营约束，不看上架天数。阈值由本 skill 自定 [待校准]
  lifecycle:
    ac_order_share_high: 0.60   # [待校准] 广告订单占比高于此 → 指向新品期
    ac_order_share_low: 0.30    # [待校准] 广告订单占比低于此 → 指向成熟期

  # ── 品牌新客占比决策含义（2026-09-17 新增，Phase 4B.1 使用）─────────────
  # 逻辑迁移自白皮书 L495-496（原文为站外创作者语境）→ 用于品牌广告归因层
  new_customer:
    strong: 0.50   # [待校准] ≥此值 → 判为拉新渠道，提高优先级并测试规模化
    weak: 0.20     # [待校准] ≤此值 → 判为承接已有需求/复购，不计入新增获客

